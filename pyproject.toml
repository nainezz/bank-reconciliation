[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-reconciliation"
version = "1.0.0"
description = "Match a bank statement against a cash book and prepare a bank reconciliation statement."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nainezz" }]
dependencies = []

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools]
packages = ["recon"]
